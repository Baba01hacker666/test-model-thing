[project]
name = "test-model-thing"
version = "0.1.0"
description = "A small proof-of-concept language model incorporating latent-space prediction and recurrent trace units, built with MLX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mlx"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# E701 (compound statement on one line) is the established style of this
# codebase (compact `if x: return` / `for ...: ...` one-liners throughout
# main.py and benchmark.py, including upstream). Enforcing multi-line blocks
# would only add diff noise, so it is ignored project-wide.
ignore = ["E701"]

[tool.bandit]
exclude_dirs = [".venv", "__pycache__"]
