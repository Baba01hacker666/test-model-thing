name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Lint & Security (Ruff & Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Bandit Security Audit
        run: bandit -r tmt main.py benchmark.py

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Automated Tests via Pytest
        run: pytest -v

      - name: Run CLI Smoke Tests
        run: |
          tmt info
          tmt status
          tmt sample --type text
          tmt sample --type cola
          tmt train --sample --steps 20 --dim 32 --layers 2 --quiet
          tmt chat --prompt "Testing CLI" --max-bytes 10 --dim 32 --layers 2 --quiet
          tmt benchmark --sample --dim 32 --layers 2 --epochs 1
